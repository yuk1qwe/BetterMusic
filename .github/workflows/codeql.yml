name: CodeQL C# security

on:
  push:
    branches: [main, native-winyandex-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze native C# application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build WinUI project for analysis
        run: dotnet build src/YMusic.WinUI/YMusic.WinUI.csproj -c Release -r win-x64 -p:Platform=x64
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
