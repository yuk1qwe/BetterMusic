name: Feather — Windows x64
on:
  push:
    branches: [sever-browser]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}\.cef
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Установить фиксированную версию Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Собрать программу с песочницей CEF
        run: cargo run --locked --release --bin bundle
      - name: Убрать из поставки файлы разработки и лишние локализации
        shell: pwsh
        run: |
          Get-ChildItem 'dist/Feather/locales' -File | Where-Object { $_.Name -notmatch '^(ru|en-US)([_.])' } | Remove-Item -Force
          Get-ChildItem 'dist/Feather' -File | Where-Object { $_.Extension -in '.pdb', '.lib' -or $_.Name -eq 'CMakeLists.txt' } | Remove-Item -Force
      - name: Проверить логику навигации и данных
        shell: pwsh
        run: |
          $env:PATH = "$PWD\target\debug;$PWD\target\release;$env:PATH"
          cargo test --locked --release --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверить окно и навигацию
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Сравнить восстановление вкладок
        shell: pwsh
        run: ./scripts/benchmark.ps1
      - name: Подготовить файлы
        shell: pwsh
        run: |
          Copy-Item README.md, LIMITATIONS.md, LICENSE, scripts/check-cef.ps1 'dist/Feather/'
      - name: Опубликовать сборку
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Feather-Windows-x64
          path: dist/Feather/
          if-no-files-found: error
          retention-days: 30
      - name: Снимок окна
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Feather-smoke-screenshot
          path: |
            dist/smoke.png
            dist/new-tab.png
            dist/benchmark.json
            dist/benchmark.txt
            dist/measurement.txt
          if-no-files-found: ignore
