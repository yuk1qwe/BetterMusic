name: UI smoke check
on:
  push:
    branches: [visual-ui-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/YMusic.WinUI/YMusic.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o dist/portable
      - name: Inspect window and test login navigation
        shell: pwsh
        run: ./scripts/check_ui.ps1
